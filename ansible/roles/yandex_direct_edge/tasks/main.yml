---
- name: Validate Yandex direct edge inputs
  ansible.builtin.assert:
    that:
      - yandex_direct_racknerd_public_key | length > 0
      - >
        (yandex_direct_wg_client_private_key | length > 0) or
        (yandex_direct_wg_client_private_key_path | length > 0)
      - >
        (yandex_direct_wg_transit_private_key | length > 0) or
        (yandex_direct_wg_transit_private_key_path | length > 0)
    fail_msg: >-
      Define yandex_direct_racknerd_public_key and provide direct Yandex
      client/transit private keys via Vault/extra-vars or *_private_key_path
      values outside git.

- name: Resolve Yandex direct client private key
  ansible.builtin.set_fact:
    yandex_direct_wg_client_private_key_resolved: >-
      {{
        (yandex_direct_wg_client_private_key | trim)
        if yandex_direct_wg_client_private_key | length > 0
        else (lookup('ansible.builtin.file', yandex_direct_wg_client_private_key_path) | trim)
      }}
  no_log: true

- name: Resolve Yandex direct transit private key
  ansible.builtin.set_fact:
    yandex_direct_wg_transit_private_key_resolved: >-
      {{
        (yandex_direct_wg_transit_private_key | trim)
        if yandex_direct_wg_transit_private_key | length > 0
        else (lookup('ansible.builtin.file', yandex_direct_wg_transit_private_key_path) | trim)
      }}
  no_log: true

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Register Yandex direct policy table name
  ansible.builtin.lineinfile:
    path: /etc/iproute2/rt_tables
    regexp: "^{{ yandex_direct_policy_table }}\\s+"
    line: "{{ yandex_direct_policy_table }} wg_direct"
    create: false

- name: Render Yandex direct client config
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: "/etc/wireguard/{{ yandex_direct_wg_client_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Yandex direct client
  no_log: true

- name: Render Yandex direct transit config
  ansible.builtin.template:
    src: wg-transit.conf.j2
    dest: "/etc/wireguard/{{ yandex_direct_wg_transit_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Yandex direct transit
  no_log: true

- name: Render Yandex direct nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ yandex_direct_nftables_conf }}"
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Enable Yandex direct client service
  ansible.builtin.service:
    name: "wg-quick@{{ yandex_direct_wg_client_interface }}"
    enabled: true
    state: started

- name: Enable Yandex direct transit service
  ansible.builtin.service:
    name: "wg-quick@{{ yandex_direct_wg_transit_interface }}"
    enabled: true
    state: started
