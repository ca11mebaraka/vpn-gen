---
exit_wg_transit_interface: wg-transit
exit_wg_transit_address: 10.70.0.2/30
exit_wg_transit_listen_port: 51821

# Provide either the private key value through Ansible Vault/extra-vars or a
# path outside the repository. Do not commit private keys.
exit_wg_transit_private_key: ""
exit_wg_transit_private_key_path: ""

exit_entry_split_wg_transit_public_key: ""
exit_entry_split_allowed_ips:
  - 10.70.0.1/32
  - 10.60.0.0/24

exit_client_cidr: 10.60.0.0/24
exit_public_interface: eth0
exit_nftables_fragment: /etc/nftables.d/exit_split.nft

exit_entry_full_enabled: true
exit_entry_full_wg_interface: wg-exit-full
exit_entry_full_wg_address: 10.91.0.2/32
exit_entry_full_wg_listen_port: 51946
exit_entry_full_wg_private_key: ""
exit_entry_full_wg_private_key_path: ""
exit_entry_full_public_key: ""
exit_entry_full_allowed_ips:
  - 10.91.0.1/32
  - 10.80.0.0/24
exit_entry_full_client_cidr: 10.80.0.0/24
exit_entry_full_nftables_fragment: /etc/nftables.d/exit_full.nft
