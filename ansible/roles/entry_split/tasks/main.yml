---
- name: Validate entry edge inputs
  ansible.builtin.assert:
    that:
      - entry_split_exit_wg_transit_public_key | length > 0
      - entry_split_admin_ipv4_cidrs | length > 0 or entry_split_allow_world_ssh | bool
      - entry_split_allow_world_ssh | bool or '0.0.0.0/0' not in entry_split_admin_ipv4_cidrs
      - >
        (entry_split_wg_client_private_key | length > 0) or
        (entry_split_wg_client_private_key_path | length > 0)
      - >
        (entry_split_wg_transit_private_key | length > 0) or
        (entry_split_wg_transit_private_key_path | length > 0)
    fail_msg: >-
      Define entry_split_exit_wg_transit_public_key, trusted
      VPN_GEN_ADMIN_IPV4_CIDRS (normally controller_ip/32), and provide
      entry_split_wg_client_private_key plus entry_split_wg_transit_private_key
      via Vault/extra-vars or *_private_key_path values outside git.

- name: Use provided entry client private key
  ansible.builtin.set_fact:
    entry_split_wg_client_private_key_resolved: "{{ entry_split_wg_client_private_key | trim }}"
  when: entry_split_wg_client_private_key | length > 0
  no_log: true

- name: Load entry client private key from external path
  ansible.builtin.set_fact:
    entry_split_wg_client_private_key_resolved: >-
      {{ lookup('ansible.builtin.file', entry_split_wg_client_private_key_path) | trim }}
  when: entry_split_wg_client_private_key | length == 0
  no_log: true

- name: Use provided entry transit private key
  ansible.builtin.set_fact:
    entry_split_wg_transit_private_key_resolved: "{{ entry_split_wg_transit_private_key | trim }}"
  when: entry_split_wg_transit_private_key | length > 0
  no_log: true

- name: Load entry transit private key from external path
  ansible.builtin.set_fact:
    entry_split_wg_transit_private_key_resolved: >-
      {{ lookup('ansible.builtin.file', entry_split_wg_transit_private_key_path) | trim }}
  when: entry_split_wg_transit_private_key | length == 0
  no_log: true

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Register WireGuard transit policy table name
  ansible.builtin.lineinfile:
    path: /etc/iproute2/rt_tables
    regexp: "^{{ entry_split_policy_table }}\\s+"
    line: "{{ entry_split_policy_table }} wg_transit"
    create: false

- name: Render entry WireGuard client config
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: "/etc/wireguard/{{ entry_split_wg_client_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart entry WireGuard client
  no_log: true

- name: Render entry WireGuard transit config
  ansible.builtin.template:
    src: wg-transit.conf.j2
    dest: "/etc/wireguard/{{ entry_split_wg_transit_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart entry WireGuard transit
  no_log: true

- name: Ensure nftables include directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Load RU IPv4 CIDRs from controller file
  ansible.builtin.set_fact:
    entry_split_ru_ipv4_cidrs: >-
      {{
        lookup('ansible.builtin.file', entry_split_ru_ipv4_cidrs_file).splitlines()
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  when:
    - entry_split_ru_ipv4_cidrs | length == 0
    - entry_split_ru_ipv4_cidrs_file | length > 0

- name: Render entry nftables fragment
  ansible.builtin.template:
    src: entry_split.nft.j2
    dest: "{{ entry_split_nftables_fragment }}"
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: Include entry nftables fragment
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "{{ entry_split_nftables_fragment }}"'
    create: false
    backup: true
  notify: Reload nftables

- name: Enable entry WireGuard client service
  ansible.builtin.service:
    name: "wg-quick@{{ entry_split_wg_client_interface }}"
    enabled: true
    state: started

- name: Enable entry WireGuard transit service
  ansible.builtin.service:
    name: "wg-quick@{{ entry_split_wg_transit_interface }}"
    enabled: true
    state: started

- name: Ensure dnsmasq is installed for VPN clients
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
  when: entry_split_dns_enabled

- name: Render dnsmasq config for VPN clients
  ansible.builtin.template:
    src: dnsmasq-wg-client.conf.j2
    dest: /etc/dnsmasq.d/wg-client.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq
  when: entry_split_dns_enabled

- name: Enable dnsmasq for VPN clients
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: started
  when:
    - entry_split_dns_enabled
    - not ansible_check_mode
