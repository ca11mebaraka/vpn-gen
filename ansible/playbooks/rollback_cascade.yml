---
- name: Guard cascade rollback execution
  hosts: all
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Require explicit rollback confirmation
      ansible.builtin.assert:
        that:
          - confirm_rollback | bool
        fail_msg: >-
          Refusing to run rollback. Re-run with
          '-e confirm_rollback=true' after confirming SSH access and the
          intended rollback scope.
      tags:
        - always

- name: Roll back Yandex edge services and policy routing
  hosts: yandex_cloud
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Stop and disable Yandex client WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-client.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - yandex
        - stop_services

    - name: Stop and disable Yandex transit WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-transit.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - yandex
        - stop_services

    - name: Remove Yandex table 200 default transit route
      ansible.builtin.command: ip route del default dev wg-transit table 200
      become: true
      register: yandex_remove_table_200_default
      changed_when: yandex_remove_table_200_default.rc == 0
      failed_when: yandex_remove_table_200_default.rc not in [0, 2]
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - yandex
        - policy_routing

    - name: Remove Yandex fwmark policy rule for table 200
      ansible.builtin.command: ip rule del fwmark 0x2 table 200
      become: true
      register: yandex_remove_fwmark_rule
      changed_when: yandex_remove_fwmark_rule.rc == 0
      failed_when: yandex_remove_fwmark_rule.rc not in [0, 2]
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - yandex
        - policy_routing

    - name: Flush Yandex route cache after policy rollback
      ansible.builtin.command: ip route flush cache
      become: true
      changed_when: false
      failed_when: false
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - yandex
        - policy_routing

- name: Roll back Racknerd transit service
  hosts: external_vps
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Stop and disable Racknerd transit WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-transit.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - racknerd
        - stop_services
