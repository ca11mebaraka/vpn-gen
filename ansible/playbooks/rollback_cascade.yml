---
- name: Guard cascade rollback execution
  hosts: all
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Require explicit rollback confirmation
      ansible.builtin.assert:
        that:
          - confirm_rollback | bool
        fail_msg: >-
          Refusing to run rollback. Re-run with
          '-e confirm_rollback=true' after confirming SSH access and the
          intended rollback scope.
      tags:
        - always

- name: Roll back entry edge services and policy routing
  hosts: entry
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Stop and disable entry client WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-client.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - entry_split
        - stop_services

    - name: Stop and disable entry transit WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-transit.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - entry_split
        - stop_services

    - name: Remove entry table 200 default transit route
      ansible.builtin.command: ip route del default dev wg-transit table 200
      become: true
      register: entry_split_remove_table_200_default
      changed_when: entry_split_remove_table_200_default.rc == 0
      failed_when: entry_split_remove_table_200_default.rc not in [0, 2]
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - entry_split
        - policy_routing

    - name: Remove entry fwmark policy rule for table 200
      ansible.builtin.command: ip rule del fwmark 0x2 table 200
      become: true
      register: entry_split_remove_fwmark_rule
      changed_when: entry_split_remove_fwmark_rule.rc == 0
      failed_when: entry_split_remove_fwmark_rule.rc not in [0, 2]
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - entry_split
        - policy_routing

    - name: Flush entry route cache after policy rollback
      ansible.builtin.command: ip route flush cache
      become: true
      changed_when: false
      failed_when: false
      when: confirm_rollback | bool
      tags:
        - rollback
        - routing
        - entry_split
        - policy_routing

- name: Roll back exit transit service
  hosts: exit
  gather_facts: false
  vars:
    confirm_rollback: false

  tasks:
    - name: Stop and disable exit transit WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-transit.service
        state: stopped
        enabled: false
      become: true
      when: confirm_rollback | bool
      tags:
        - rollback
        - wireguard
        - exit
        - stop_services
