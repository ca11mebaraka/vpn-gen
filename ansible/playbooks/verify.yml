---
- name: Verify prepared hosts
  hosts: entry_split:exit
  gather_facts: true

  tasks:
    - name: Check SSH login user
      ansible.builtin.command: whoami
      become: false
      changed_when: false
      register: whoami_result

    - name: Assert connected as configured ansible_user
      ansible.builtin.assert:
        that:
          - whoami_result.stdout == ansible_user
        fail_msg: >-
          Connected as '{{ whoami_result.stdout }}' but inventory expects
          '{{ ansible_user }}'. Fix VPN_GEN_*_SSH_USER in .env for this host.
      when: not ansible_check_mode

    - name: Check passwordless sudo
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false

    - name: Check configured SSH user exists in passwd database
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"

    - name: Show prepared host summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          ansible_host: "{{ ansible_host }}"
          connected_as: "{{ whoami_result.stdout }}"
          distribution: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          sudo_nopasswd: "{{ deploy_sudo_nopasswd | default(true) }}"
