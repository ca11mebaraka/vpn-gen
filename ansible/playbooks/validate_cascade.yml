---
- name: Validate cascade VPN baseline and shared host state
  hosts: all
  gather_facts: false
  vars:
    entry_split_dual: "{{ hostvars[inventory_hostname].entry_split_dual_exit_enabled | default(false) | bool }}"
    expected_wg_interfaces: >-
      {{
        (['wg-client', 'wg-client-2', 'wg-transit', 'wg-transit-2']
         if entry_split_dual
         else ['wg-client', 'wg-transit'])
        if inventory_hostname in groups.get('entry_split', [])
        else ['wg0', 'wg-transit']
        if inventory_hostname in groups.get('entry_full', [])
        else (['wg-transit', 'wg-exit-full'] if exit_entry_full_enabled | default(false) else ['wg-transit'])
        if inventory_hostname in groups.get('exit', [])
        else []
      }}

  tasks:
    - name: Confirm SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 20

    - name: Confirm login user
      ansible.builtin.command: whoami
      become: false
      changed_when: false
      register: validate_whoami

    - name: Confirm passwordless sudo
      ansible.builtin.command: sudo -n true
      become: false
      changed_when: false

    - name: Gather minimal host facts
      ansible.builtin.setup:
        gather_subset:
          - min

    - name: Confirm IPv4 forwarding is enabled
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      become: true
      changed_when: false
      register: ip_forward_state

    - name: Assert IPv4 forwarding state
      ansible.builtin.assert:
        that:
          - ip_forward_state.stdout == '1'
        fail_msg: "net.ipv4.ip_forward must be 1 for cascade forwarding."

    - name: List WireGuard interfaces known to kernel
      ansible.builtin.command: wg show interfaces
      become: true
      changed_when: false
      register: wg_show_interfaces

    - name: Assert expected WireGuard interfaces are present
      ansible.builtin.assert:
        that:
          - expected_wg_interfaces | difference(wg_show_interfaces.stdout.split()) | length == 0
        fail_msg: "Missing expected WireGuard interfaces: {{ expected_wg_interfaces | difference(wg_show_interfaces.stdout.split()) }}"

    - name: Check expected WireGuard service state
      ansible.builtin.command: "systemctl is-active wg-quick@{{ item }}.service"
      become: true
      changed_when: false
      register: wg_service_state
      failed_when: wg_service_state.rc != 0
      loop: "{{ expected_wg_interfaces }}"

    - name: Check expected WireGuard link state
      ansible.builtin.command: "ip link show dev {{ item }}"
      become: true
      changed_when: false
      loop: "{{ expected_wg_interfaces }}"

    - name: Check expected WireGuard runtime details
      ansible.builtin.command: "wg show {{ item }}"
      become: true
      changed_when: false
      loop: "{{ expected_wg_interfaces }}"

    - name: Read nftables ruleset
      ansible.builtin.command: nft list ruleset
      become: true
      changed_when: false
      register: nft_ruleset

    - name: Assert nftables ruleset is loaded
      ansible.builtin.assert:
        that:
          - nft_ruleset.stdout | length > 0
        fail_msg: "nftables ruleset is empty or unavailable."

    - name: Report baseline validation summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          connected_as: "{{ validate_whoami.stdout }}"
          expected_wg_interfaces: "{{ expected_wg_interfaces }}"
          nft_counter_expressions_present: "{{ 'counter' in nft_ruleset.stdout }}"

- name: Validate split entry routing and policy
  hosts: entry_split
  gather_facts: false
  vars:
    entry_split_dual: "{{ entry_split_dual_exit_enabled | default(false) | bool }}"

  tasks:
    - name: Read entry policy routing rules
      ansible.builtin.command: ip rule show
      become: true
      changed_when: false
      register: entry_split_ip_rules

    - name: Assert entry fwmark rule for table 200 exists
      ansible.builtin.assert:
        that:
          - "'fwmark 0x2' in entry_split_ip_rules.stdout"
          - "'lookup 200' in entry_split_ip_rules.stdout or 'lookup wg_transit' in entry_split_ip_rules.stdout"
        fail_msg: "Expected entry policy rule 'fwmark 0x2 lookup 200/wg_transit' was not found."

    - name: Assert entry fwmark rule for table 201 exists when dual-exit enabled
      ansible.builtin.assert:
        that:
          - "'fwmark 0x4' in entry_split_ip_rules.stdout"
          - "'lookup 201' in entry_split_ip_rules.stdout or 'lookup wg_transit_2' in entry_split_ip_rules.stdout"
        fail_msg: "Expected entry policy rule 'fwmark 0x4 lookup 201/wg_transit_2' was not found."
      when: entry_split_dual

    - name: Read entry policy routing table 200
      ansible.builtin.command: ip route show table 200
      become: true
      changed_when: false
      register: entry_split_table_200

    - name: Assert entry table 200 routes default traffic to transit
      ansible.builtin.assert:
        that:
          - "'default' in entry_split_table_200.stdout"
          - "'dev wg-transit' in entry_split_table_200.stdout"
        fail_msg: "Expected table 200 default route through wg-transit was not found."

    - name: Read entry policy routing table 201
      ansible.builtin.command: ip route show table 201
      become: true
      changed_when: false
      register: entry_split_table_201
      when: entry_split_dual

    - name: Assert entry table 201 routes default traffic to transit lane 2
      ansible.builtin.assert:
        that:
          - "'default' in entry_split_table_201.stdout"
          - "'dev wg-transit-2' in entry_split_table_201.stdout"
        fail_msg: "Expected table 201 default route through wg-transit-2 was not found."
      when: entry_split_dual

    - name: Probe marked non-RU route decision lane 1
      ansible.builtin.command: ip route get 1.1.1.1 mark 0x2
      become: true
      changed_when: false
      register: entry_split_marked_route

    - name: Assert marked non-RU probe uses transit lane 1
      ansible.builtin.assert:
        that:
          - "'wg-transit' in entry_split_marked_route.stdout"
        fail_msg: "Marked route probe did not resolve through wg-transit."

    - name: Probe marked non-RU route decision lane 2
      ansible.builtin.command: ip route get 1.1.1.1 mark 0x4
      become: true
      changed_when: false
      register: entry_split_marked_route_2
      when: entry_split_dual

    - name: Assert marked non-RU probe uses transit lane 2
      ansible.builtin.assert:
        that:
          - "'wg-transit-2' in entry_split_marked_route_2.stdout"
        fail_msg: "Marked route probe (0x4) did not resolve through wg-transit-2."
      when: entry_split_dual

    - name: Read entry nftables ruleset
      ansible.builtin.command: nft list ruleset
      become: true
      changed_when: false
      register: entry_split_nft_ruleset

    - name: Assert entry nftables split-routing rules are present
      ansible.builtin.assert:
        that:
          - "'wg-client' in entry_split_nft_ruleset.stdout"
          - "'wg-transit' in entry_split_nft_ruleset.stdout"
          - "'ru4' in entry_split_nft_ruleset.stdout"
          - "'0x00000002' in entry_split_nft_ruleset.stdout or '0x2' in entry_split_nft_ruleset.stdout"
          - "'masquerade' in entry_split_nft_ruleset.stdout"
          - "'counter' in entry_split_nft_ruleset.stdout"
        fail_msg: "Split entry nftables ruleset is missing expected split-routing, NAT, or counter expressions."

    - name: Assert dual-exit nftables expressions are present
      ansible.builtin.assert:
        that:
          - "'wg-client-2' in entry_split_nft_ruleset.stdout"
          - "'wg-transit-2' in entry_split_nft_ruleset.stdout or '0x4' in entry_split_nft_ruleset.stdout"
        fail_msg: "Dual-exit nftables rules (wg-client-2 / mark 0x4) were not found."
      when: entry_split_dual

    - name: Check wg-transit lane 1 handshake freshness
      ansible.builtin.command: wg show wg-transit latest-handshakes
      become: true
      changed_when: false
      register: wg_transit_handshakes

    - name: Assert wg-transit lane 1 has recent handshake
      ansible.builtin.assert:
        that:
          - wg_transit_handshakes.stdout.split() | length >= 2
          - (wg_transit_handshakes.stdout.split() | last | int) > 0
        fail_msg: "wg-transit lane 1 has no handshake — check UDP path and listen port (host_vars)."
      when: not ansible_check_mode

    - name: Check wg-transit lane 2 handshake freshness
      ansible.builtin.command: wg show wg-transit-2 latest-handshakes
      become: true
      changed_when: false
      register: wg_transit_2_handshakes
      when: entry_split_dual

    - name: Assert wg-transit lane 2 has recent handshake
      ansible.builtin.assert:
        that:
          - wg_transit_2_handshakes.stdout.split() | length >= 2
          - (wg_transit_2_handshakes.stdout.split() | last | int) > 0
        fail_msg: "wg-transit-2 has no handshake."
      when:
        - entry_split_dual
        - not ansible_check_mode

    - name: Probe DNS on lane 2 listen address
      ansible.builtin.command: dig +short @10.61.0.1 yandex.ru A
      become: true
      changed_when: false
      register: entry_dns_lane2
      when: entry_split_dual

    - name: Assert lane 2 DNS resolver responds
      ansible.builtin.assert:
        that:
          - entry_dns_lane2.stdout | trim | length > 0
        fail_msg: "dnsmasq on 10.61.0.1 did not resolve yandex.ru."
      when: entry_split_dual

- name: Validate Exit node routing and NAT assumptions
  hosts: exit
  gather_facts: false
  vars:
    exit_probe_client_ip: "{{ (exit_client_cidr | default('10.60.0.0/24')).split('/')[0].rsplit('.', 1)[0] }}.10"
    exit_expected_client_cidr: "{{ exit_client_cidr | default('10.60.0.0/24') }}"

  tasks:
    - name: Probe exit route back to client subnet
      ansible.builtin.command: "ip route get {{ exit_probe_client_ip }}"
      become: true
      changed_when: false
      register: exit_route_to_client

    - name: Assert exit routes client subnet through transit
      ansible.builtin.assert:
        that:
          - "'wg-transit' in exit_route_to_client.stdout"
        fail_msg: "exit route to {{ exit_probe_client_ip }} does not use wg-transit."

    - name: Read exit nftables ruleset
      ansible.builtin.command: nft list ruleset
      become: true
      changed_when: false
      register: exit_nft_ruleset

    - name: Assert exit NAT assumptions
      ansible.builtin.assert:
        that:
          - "'wg-transit' in exit_nft_ruleset.stdout"
          - exit_expected_client_cidr in exit_nft_ruleset.stdout
          - "'masquerade' in exit_nft_ruleset.stdout"
          - "'counter' in exit_nft_ruleset.stdout"
        fail_msg: "exit nftables ruleset is missing expected transit NAT or counter expressions."
